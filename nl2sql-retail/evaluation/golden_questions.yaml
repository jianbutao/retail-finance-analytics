  - id: S06
    category: 单指标
    result_type: scalar
    required_tokens: [include_product_cancellations, include_product_sales]
    question: 2011年11月取消金额占正向金额的比例是多少
    reference_sql: |
      SELECT ROUND(
        -SUM(line_amount) FILTER (WHERE include_product_cancellations)
        / NULLIF(SUM(line_amount) FILTER (WHERE include_product_sales), 0) * 100, 2)
      FROM analytics.transactions
      WHERE source_batch = '20260917T121850_455264Z'
        AND DATE_TRUNC('month', invoice_date)::date = '2011-11-01'

  - id: S07
    category: 单指标
    result_type: scalar
    required_tokens: [include_product_sales, "distinct"]
    question: 2011年一共有多少天有销售记录
    reference_sql: |
      SELECT COUNT(DISTINCT invoice_date::date)
      FROM analytics.transactions
      WHERE source_batch = '20260917T121850_455264Z'
        AND include_product_sales
        AND invoice_date >= '2011-01-01'
        AND invoice_date < '2012-01-01'

