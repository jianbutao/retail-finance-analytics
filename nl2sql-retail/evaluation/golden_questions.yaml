  - id: M01
    category: 多指标组合
    result_type: table
    required_tokens: [include_product_sales, include_product_cancellations, "distinct"]
    question: 2011年11月的正向金额、取消金额、净额和订单数分别是多少
    reference_sql: |
      SELECT
        ROUND(SUM(line_amount) FILTER (WHERE include_product_sales), 2) AS gross,
        ROUND(-SUM(line_amount) FILTER (WHERE include_product_cancellations), 2) AS cancel,
        ROUND(SUM(line_amount) FILTER (
          WHERE include_product_sales OR include_product_cancellations), 2) AS net,
        COUNT(DISTINCT invoice_no) FILTER (WHERE include_product_sales) AS orders
      FROM analytics.transactions
      WHERE source_batch = '20260917T121850_455264Z'
        AND DATE_TRUNC('month', invoice_date)::date = '2011-11-01'

  - id: M02
    category: 多指标组合
    result_type: scalar
    required_tokens: [include_customer_sales, include_product_sales]
    question: 2011年11月金额最高的10个客户占全部正向金额的比例
    reference_sql: |
      WITH cs AS (
        SELECT customer_id, SUM(line_amount) AS amt
        FROM analytics.transactions
        WHERE source_batch = '20260917T121850_455264Z'
          AND include_customer_sales
          AND DATE_TRUNC('month', invoice_date)::date = '2011-11-01'
        GROUP BY customer_id
      ), tot AS (
        SELECT SUM(line_amount) AS all_amt
        FROM analytics.transactions
        WHERE source_batch = '20260917T121850_455264Z'
          AND include_product_sales
          AND DATE_TRUNC('month', invoice_date)::date = '2011-11-01'
      )
      SELECT ROUND(
        (SELECT SUM(amt) FROM (SELECT amt FROM cs ORDER BY amt DESC LIMIT 10) x)
        / (SELECT all_amt FROM tot) * 100, 2)

