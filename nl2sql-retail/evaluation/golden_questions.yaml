questions:
  - id: S01
    category: 单指标
    result_type: scalar
    required_tokens: [include_product_sales]
    question: 2011年11月的商品正向交易金额是多少
    reference_sql: |
      SELECT ROUND(SUM(line_amount) FILTER (WHERE include_product_sales), 2)
      FROM analytics.transactions
      WHERE source_batch = '20260917T121850_455264Z'
        AND DATE_TRUNC('month', invoice_date)::date = '2011-11-01'

