  - id: D02
    category: 维度筛选
    result_type: table
    required_tokens: [include_product_sales, group by]
    question: 2011年商品正向金额最高的5个国家
    reference_sql: |
      SELECT country, ROUND(SUM(line_amount), 2) AS gross
      FROM analytics.transactions
      WHERE source_batch = '20260917T121850_455264Z'
        AND include_product_sales
        AND invoice_date >= '2011-01-01' AND invoice_date < '2012-01-01'
      GROUP BY country
      ORDER BY gross DESC
      LIMIT 5

